plugins {
    id 'java'
    id 'application'
  }
repositories {
    mavenCentral()
  }

dependencies {
   implementation 'com.opencsv:opencsv:5.12.0'
   implementation 'info.picocli:picocli:4.7.7'
    // Optional, but recommended for GraalVM native-image configuration generation
    annotationProcessor 'info.picocli:picocli-codegen:4.7.7'
  }

application {
    mainClass = 'Main'
  }

tasks.named('run') {
    standardInput = System.in
}
